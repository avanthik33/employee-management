<div class="employee-container">
  <h2>Employee Details</h2>
  @if(isLoading()){
  <h1>loading</h1>
  }
  @else{
  <ng-content>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact No</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (employee of employeesList; track $index) {
        <tr>
          <td>{{ employee.employeeName }}</td>
          <td>{{ employee.contactNo }}</td>
          <td>{{ employee.emailId }}</td>
          <td>
            <button class="update-btn" (click)="handleUpdateEmployee(employee)">Update</button>
            <button class="delete-btn" (click)="deleteEmployee(employee.employeeId)">Delete</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </ng-content>
  }

</div>



<div class="popupModel" #updateModel>
  <div class="modal-content">
    <h2>Edit Project</h2>

    <form (submit)="updateEmployee()">

      <div class="form-group">
        <label for="name">Employee Name</label>
        <input id="name" [(ngModel)]="formData.employeeName" name="employeeName" type="text" required />
      </div>

      <div class="form-group">
        <label for="contactNo">Contact No</label>
        <input id="contactNo" [(ngModel)]="formData.contactNo" name="contactNo" type="text" required />
      </div>


      <div class="form-group">
        <label for="emailId">Email</label>
        <input id="emailId" [(ngModel)]="formData.emailId" name="emailId" type="email" required />
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <div class="radio-group">
          <div class="radio-item">
            <input type="radio" [(ngModel)]="formData.gender" value="male" id="male" name="gender">
            <label for="male">Male</label>
          </div>
          <div class="radio-item">
            <input type="radio" [(ngModel)]="formData.gender" value="female" id="female" name="gender">
            <label for="female">Female</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" [(ngModel)]="formData.password" type="password" name="password" required />
      </div>

      <div class="modal-actions">
        <button type="submit">Update</button>
        <button type="button" (click)="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>
