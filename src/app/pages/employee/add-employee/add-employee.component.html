<div class="form-container">
  <div class="heading">
    <h1>ADD EMPLOYEE</h1>
  </div>
  <form [formGroup]="formData" (ngSubmit)="handleSubmit()">

    <div class="form-group">
      <label for="employeeName">Employee Name</label>
      <input type="text" id="employeeName" formControlName="employeeName" required>
    </div>

    <div class="form-group">
      <label for="contactNo">Contact No</label>
      <input type="text" id="contactNo" formControlName="contactNo" required>
    </div>

    <div class="form-group">
      <label for="emailId">Email ID</label>
      <input type="email" id="emailId" formControlName="emailId" required>
    </div>

    <div class="form-group">
      <label for="parentDepartment">Main Department</label>
      <select formControlName="deptId" (change)="handleGetSubDepartment()">
        <option value="">Select Department</option>
        @for (department of parentDepartmentList; track $index) {
        <option value="{{department.departmentId}}">{{ department.departmentName }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="childDepartment">Sub Department</label>
      <select formControlName="childDep">
        <option value="">Select Sub Department</option>
        @for (department of childDepartmentList; track $index) {
        <option value="{{department.childDeptId}}">{{ department.departmentName }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="gender">Gender</label>
      <div class="radio-group">
        <div class="radio-item">
          <input type="radio" formControlName="gender" value="male" id="male">
          <label for="male">Male</label>
        </div>
        <div class="radio-item">
          <input type="radio" formControlName="gender" value="female" id="female">
          <label for="female">Female</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" required>
    </div>

    <div class="form-group">
      <button type="submit" [disabled]="formData.invalid">ADD Employee</button>
    </div>

  </form>
</div>
