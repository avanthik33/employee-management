<div class="project-container">
  <h2>Project Details</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Client Name</th>
        <th>Start Date</th>
        <th>Lead</th>
        <th>Email</th>
        <th>Action</th>

      </tr>
    </thead>
    <tbody>
      @for (project of projectList(); track $index) {
      <tr>
        <td>{{ project.projectName }}</td>
        <td>{{ project.clientName }}</td>
        <td>{{ project.startDate }}</td>
        <td>{{ project.leadByEmpId }}</td>
        <td>{{ project.emailId }}</td>
        
        <td>
          <button class="update-btn" (click)="updateProject(project.projectId)">Update</button>
          <button class="delete-btn" (click)="deleteProject(project.projectId)">Delete</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
