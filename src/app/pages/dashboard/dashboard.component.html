<div class="container">
  <div class="head">
    <h1>DASHBOARD</h1>
  </div>
  <div class="content">
    <div class="dashboard-container">

      <div class="stats-cards">
        <div class="card">
          <div class="card-header">
            <h3>Total Projects</h3>
          </div>
          <div class="card-body">
            <p>TotalProjects</p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Total Employees</h3>
          </div>
          <div class="card-body">
            <p> totalEmployees</p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Total Revenue</h3>
          </div>
          <div class="card-body">
            <p> totalRevenue </p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Active Users</h3>
          </div>
          <div class="card-body">
            <p>activeUsers </p>
          </div>
        </div>
      </div>

      <div class="additional-section">
        <h3>Latest Activity</h3>
        <div class="activity-feed">
          <!-- <div *ngFor="let activity of activities" class="activity-item">
            <p>{{ activity }}</p>
          </div> -->
        </div>
      </div>
    </div>

  </div>
</div>
