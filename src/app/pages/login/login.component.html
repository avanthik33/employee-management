<main class="main-login">
  <div class="left-login">
    <h1>Login<br>And join our team</h1>
    <img src="https://i.postimg.cc/YC13sX2Z/Astronaut-cuate.png" class="left-login-img" alt="astronaut image">
  </div>

  <div class="right-login">
    <form [formGroup]="formData" (submit)="handleLogin()">
      <div class="card-login">
        <h1>Login</h1>
        <div class="textfield">
          <label for="user">Email</label>
          <input type="text" formControlName="userName" name="user" placeholder="Email">
        </div>

        <div class="textfield">
          <label for="password">Password</label>
          <input type="password" name="password" formControlName="password" placeholder="Password">
        </div>
        <button [disabled]="isLoading() || formData.invalid" class="btn-login">
          @if(isLoading()){
          <ng-container>
            loading
          </ng-container>
          }@else {
          <ng-container>
            Login
          </ng-container>
          }
        </button>
      </div>
    </form>
  </div>
</main>
